schema_version: "1"

identity:
  id: "@omadia/channel-teams"
  name: "Microsoft Teams Channel"
  version: "0.27.0"
  kind: "channel"
  domain: "channel.teams"
  description: "Microsoft Teams als First-Class-Channel für Omadia. Bot-Framework-Adapter, Adaptive-Card-Rendering, Roster + Mention-Resolution, Attachment-Persistenz mit HMAC-signiertem Proxy. Konsumiert den geteilten Graph-Client aus `@omadia/integration-microsoft365` für Attachment-Downloads + Roster-Lookups."
  authors:
    - name: "byte5 GmbH"
      email: "info@omadia.ai"
      url: "https://omadia.ai"
  license: "MIT"
  categories:
    - "channel"
    - "communication"

compat:
  core: ">=1.0 <2.0"
  node: ">=20"

lifecycle:
  entry: "dist/plugin.js"

# US4 (Conductor Surface) — let real Teams activity trigger Conductor workflows.
# Each `event_emit` capability is registered into the deny-by-default event catalog
# (a plugin may only emit an id it declared); `ctx.events` itself is provisioned by
# `events.emit: true` under the `permissions:` block further below. Operators subscribe
# a workflow's event-trigger to these ids.
capabilities:
  - id: "teams.message.posted"
    event_emit: true
  - id: "teams.mention"
    event_emit: true

# Implicit prerequisite: the Microsoft 365 integration owns the Bot-Framework
# App registration (app_id / tenant_id / app_password). The plugin resolves
# those via ctx dependency-chain from that integration's registry entry;
# Teams-specific knobs live in this plugin's own entry.
depends_on:
  - "@omadia/integration-microsoft365"

setup:
  guide:
    en: |
      ## Connect Microsoft Teams

      Teams runs as an Azure Bot that reuses the **same Azure AD app** as the
      Microsoft 365 integration. **Install @omadia/integration-microsoft365
      first** — it owns the app credentials (client id / secret / tenant); this
      channel only adds Teams-specific knobs.

      ### 1. Register the Azure Bot
      1. [Azure Portal](https://portal.azure.com) → create an **Azure Bot** resource.
      2. Use the **existing app registration** from the Microsoft 365 integration
         (same Microsoft App ID).
      3. **Configuration → Messaging endpoint**:
         `<your-public-base-url>/api/teams/messages`.
      4. **Channels** → enable **Microsoft Teams**.

      ### Multiple bots (optional)
      One plugin install can run **several Teams bots** — one Entra app
      registration / Azure bot per omadia agent. Configure them as a JSON
      array in **Teams Bots (JSON)**:

      ```json
      [{"botSlug": "default", "appId": "<entra-app-id>",
        "tenantId": "<entra-tenant-id>",
        "appPasswordSecretRef": "microsoft_app_password",
        "appType": "SingleTenant", "displayName": "Omadia"}]
      ```

      - `appPasswordSecretRef` names the **vault secret** holding that bot's
        app password — never put the password itself into config.
      - `appType` defaults to `SingleTenant` (Azure deprecated creating
        MultiTenant registrations 07/2025); legacy bots may set `MultiTenant`.
      - Each bot's Azure **messaging endpoint** is
        `<your-public-base-url>/api/teams/<botSlug>/messages`. The first
        entry is the **default bot** — it also serves the legacy
        `/api/teams/messages` and `/api/messages` endpoints, so existing
        Azure bot registrations keep working.
      - Leave the field empty to keep the classic single-bot setup: the
        Microsoft 365 integration's app credentials are used as bot
        `default` (app type from `MICROSOFT_APP_TYPE`, default MultiTenant).

      ### 2. Upload the Teams app
      Upload the Teams app package (manifest.json + icons as a ZIP) in Teams under
      **Apps → Manage your apps → Upload a custom app**.

      ### 3. Optional knobs
      - **OAuth Connection Name**: if you add a v4 OAuth connection in the Azure
        Bot Service, put its name here to enable calendar SSO (OBO flow). Empty →
        calendar tools report `sso_unavailable`.
      - **Notify Team ID**: the AAD groupId of the team where bell notifications
        appear — get it via Teams → Team settings → **Get link to team** (groupId
        query param) or Graph Explorer (`/teams`). Empty → log-only.
      - Attachment prefix, topic URL and directory label have safe defaults.

      ### 4. Auto-invite agent apps (optional Graph consent)
      With **Agent Apps (JSON)** (`teams_agent_apps`) configured, the channel
      auto-installs the listed omadia agent apps into a team when one of its
      bots is added there. That needs two extra Graph **application
      permissions** on the shared app registration (admin consent required —
      note that previously granted consent does **not** stretch to newly
      added scopes: re-grant admin consent on the existing registration,
      otherwise Graph keeps answering 403):

      - `AppCatalog.ReadWrite.All` — resolve the agent app in the tenant
        app catalog (`/appCatalogs/teamsApps`)
      - `TeamsAppInstallation.ReadWriteForTeam.All` — install the catalog
        app into the target team (`POST /teams/{team-id}/installedApps`)

      Grant them under **API permissions → Add a permission → Microsoft
      Graph → Application permissions**, then **Grant admin consent for
      <Tenant>** — or send an admin through the tenant-wide admin-consent
      URL (public client id only, never a secret):
      `https://login.microsoftonline.com/<tenant-id>/adminconsent?client_id=<application-client-id>`

      Two field-tested gotchas: portal/CLI consent sometimes silently fails
      to apply (command succeeds, Graph keeps answering 403) — then grant
      the app roles directly via REST `POST
      /servicePrincipals/{app-sp-object-id}/appRoleAssignments`, one call
      per missing permission. And acquired tokens are cached: **restart the
      middleware after granting consent**, or the 403s persist even though
      consent is in place. Without consent the feature degrades gracefully —
      the bot posts a fallback card with per-agent install deep links
      (`https://teams.microsoft.com/l/app/<teamsAppId>`, public app ids
      only).
    de: |
      ## Microsoft Teams verbinden

      Teams läuft als Azure-Bot und nutzt die **gleiche Azure-AD-App** wie die
      Microsoft-365-Integration. **Installiere zuerst
      @omadia/integration-microsoft365** — sie besitzt die App-Credentials
      (Client-ID / Secret / Tenant); dieser Channel ergänzt nur Teams-spezifische
      Einstellungen.

      ### 1. Azure-Bot registrieren
      1. [Azure Portal](https://portal.azure.com) → **Azure Bot**-Ressource anlegen.
      2. Die **bestehende App-Registration** der Microsoft-365-Integration
         verwenden (gleiche Microsoft App ID).
      3. **Configuration → Messaging endpoint**:
         `<deine-public-base-url>/api/teams/messages`.
      4. **Channels** → **Microsoft Teams** aktivieren.

      ### Mehrere Bots (optional)
      Eine Plugin-Installation kann **mehrere Teams-Bots** betreiben — eine
      Entra-App-Registration / ein Azure-Bot pro omadia-Agent. Konfiguration
      als JSON-Array im Feld **Teams Bots (JSON)**:

      ```json
      [{"botSlug": "default", "appId": "<entra-app-id>",
        "tenantId": "<entra-tenant-id>",
        "appPasswordSecretRef": "microsoft_app_password",
        "appType": "SingleTenant", "displayName": "Omadia"}]
      ```

      - `appPasswordSecretRef` benennt das **Vault-Secret** mit dem
        App-Passwort des Bots — niemals das Passwort selbst in die Config.
      - `appType` defaultet auf `SingleTenant` (Azure hat das Anlegen von
        MultiTenant-Registrations 07/2025 deprecated); Bestands-Bots dürfen
        `MultiTenant` setzen.
      - Der Azure-**Messaging endpoint** je Bot ist
        `<deine-public-base-url>/api/teams/<botSlug>/messages`. Der erste
        Eintrag ist der **Default-Bot** — er bedient zusätzlich die
        Legacy-Endpoints `/api/teams/messages` und `/api/messages`,
        bestehende Azure-Bot-Registrierungen funktionieren also weiter.
      - Feld leer lassen → klassisches Single-Bot-Setup: die App-Credentials
        der Microsoft-365-Integration werden als Bot `default` verwendet
        (App-Typ aus `MICROSOFT_APP_TYPE`, Default MultiTenant).

      ### 2. Teams-App hochladen
      Teams-App-Paket (manifest.json + Icons als ZIP) in Teams unter
      **Apps → Manage your apps → Upload a custom app** hochladen.

      ### 3. Optionale Einstellungen
      - **OAuth Connection Name**: wenn du im Azure Bot Service eine v4-OAuth-
        Connection einrichtest, ihren Namen hier eintragen → Kalender-SSO (OBO).
        Leer → Kalender-Tools melden `sso_unavailable`.
      - **Notify Team ID**: AAD-groupId des Teams, in dem Bell-Notifications
        erscheinen — via Teams → Team-Einstellungen → **Link zum Team abrufen**
        (groupId-Parameter) oder Graph Explorer (`/teams`). Leer → nur Log.
      - Attachment-Präfix, Topic-URL und Directory-Label haben sichere Defaults.

      ### 4. Agent-Apps automatisch einladen (optionaler Graph-Consent)
      Mit konfiguriertem **Agent Apps (JSON)** (`teams_agent_apps`)
      installiert der Channel die gelisteten omadia-Agent-Apps automatisch
      in ein Team, sobald einer seiner Bots dort hinzugefügt wird. Dafür
      braucht die geteilte App-Registration zwei zusätzliche
      Graph-**Application-Permissions** (Admin-Consent erforderlich —
      Achtung: bereits erteilter Consent deckt neu hinzugefügte Scopes
      **nicht** ab; der Admin-Consent muss auf der bestehenden Registration
      erneut erteilt werden, sonst antwortet Graph weiter 403):

      - `AppCatalog.ReadWrite.All` — Agent-App im Tenant-App-Katalog
        auflösen (`/appCatalogs/teamsApps`)
      - `TeamsAppInstallation.ReadWriteForTeam.All` — Katalog-App ins
        Ziel-Team installieren (`POST /teams/{team-id}/installedApps`)

      Vergabe unter **API permissions → Add a permission → Microsoft Graph
      → Application permissions**, danach **Grant admin consent for
      <Tenant>** — oder einen Admin über die tenant-weite Admin-Consent-URL
      schicken (nur die öffentliche Client-ID, nie ein Secret):
      `https://login.microsoftonline.com/<tenant-id>/adminconsent?client_id=<application-client-id>`

      Zwei Praxis-Fallen: Portal-/CLI-Consent greift manchmal
      stillschweigend nicht (Kommando meldet Erfolg, Graph antwortet weiter
      403) — dann die App-Roles direkt via REST `POST
      /servicePrincipals/{app-sp-object-id}/appRoleAssignments` vergeben,
      ein Call pro fehlender Permission. Und: Tokens werden gecacht —
      **nach dem Consent die Middleware neu starten**, sonst bleiben die
      403s trotz erteiltem Consent bestehen. Ohne Consent degradiert das
      Feature sauber — der Bot postet eine Fallback-Card mit
      Install-Deep-Links pro Agent
      (`https://teams.microsoft.com/l/app/<teamsAppId>`, nur öffentliche
      App-IDs).
  fields:
    - key: "teams_bots"
      type: "string"
      label: "Teams Bots (JSON)"
      help: "Optionale Multi-Bot-Konfiguration (#860): JSON-Array von Bot-Identitäten [{botSlug, appId, tenantId, appPasswordSecretRef, appType?, displayName?}]. appPasswordSecretRef referenziert das Vault-Secret mit dem App-Passwort des Bots (niemals das Passwort inline). appType: MultiTenant | SingleTenant | UserAssignedMSI, Default SingleTenant. Eintrag 0 ist der Default-Bot (bedient auch /api/messages + /api/teams/messages); jeder Bot empfängt unter /api/teams/<botSlug>/messages. Leer lassen → Single-Bot-Betrieb über die Credentials der Microsoft-365-Integration (microsoft_app_id / microsoft_tenant_id / microsoft_app_password, App-Typ aus MICROSOFT_APP_TYPE, Default MultiTenant)."
      required: false
    - key: "teams_agent_apps"
      type: "string"
      label: "Auto-Invite Agenten-Apps (JSON)"
      help: "Optionale Auto-Invite-Konfiguration (#860 W2): JSON-Array [{agentSlug, teamsAppExternalId, teamsAppId?, displayName?}]. Wird einer unserer Bots in ein Team eingeladen, installiert er die gelisteten Agenten-Apps automatisch über die teamsProvisioner@1-Capability des M365-Connectors (Graph-Consent siehe Setup-Guide Abschnitt 4). agentSlug ist der Omadia-Conductor-Slug (nur Label/Status, kein Routing). teamsAppId (Graph-Katalog-ID) überspringt den Katalog-Lookup; ohne sie wird getCatalogApp des Connectors (>= 0.3.1) genutzt, sofern vorhanden. Alle IDs sind öffentliche App-IDs — niemals Secrets. Leer lassen → Feature komplett aus."
      required: false
    - key: "teams_sso_connection_name"
      type: "string"
      label: "Bot Framework OAuth Connection Name"
      help: "Name der im Azure Bot Service konfigurierten OAuth-Connection (v4). Wenn gesetzt, versucht der Bot pro Turn ein UserTokenClient.getUserToken() — das resultierende JWT wird als ssoAssertion an die Kalender-Tools weitergereicht (OBO-Flow für delegierte Graph-Scopes). Leer lassen → Kalender-Tools surface 'sso_unavailable'."
      required: false
    - key: "teams_attachment_key_prefix"
      type: "string"
      label: "Tigris-Key-Präfix für Attachments"
      help: "Namespace-Präfix für persistierte Teams-Attachments im gemeinsamen Tigris-Bucket. Erlaubt Co-Existenz mit den Diagram-Renderings (`diagrams/`). Default 'teams-attachments'."
      required: false
      default: "teams-attachments"
    - key: "teams_notify_team_id"
      type: "string"
      label: "Teams-Team-ID für Bell-Notifications"
      help: "Group-ID des Microsoft Teams Teams (AAD groupId), in dem plugin-emittierte Notifications als Activity-Feed-Bell erscheinen sollen. Holst du via Teams → Team-Settings → Get link to team → groupId-Query-Param ODER via Graph Explorer (/teams). Leer lassen → Fallback auf log-only."
      required: false
    - key: "teams_notify_topic_url"
      type: "string"
      label: "Topic-URL für Activity-Notification"
      help: "Browser-Url die Teams öffnet, wenn der User auf die Bell-Notification klickt. Default: Omadia-Hub. Plugin-spezifische Deep-Links überschreiben das pro Notification."
      required: false
      default: "https://odoo-bot-harness.fly.dev/p/channel-teams/hub"
    - key: "teams_directory_label"
      type: "string"
      label: "Dashboard-Label für Channel-Routing"
      help: "Optionales operator-freundliches Label für /operator/channels (statt 'Teams · <bot-app-id-short>'). Beispiel: 'Teams · Production · Marketing'. Leer lassen → generiertes Default-Label."
      required: false

playbook:
  when_to_use: |
    Der Teams-Channel wird aktiviert, sobald die Microsoft-365-Integration
    (app_id + tenant_id + app_password) konfiguriert ist — oder eine
    explizite Multi-Bot-Liste in `teams_bots` steht. Endanwender
    interagieren mit dem Bot über Microsoft Teams; der Channel ownt die
    Bot-Framework-Runtime unter /api/teams/<botSlug>/messages (plus die
    Default-Bot-Aliasse /api/messages und /api/teams/messages) sowie den
    signierten Attachment-Proxy unter /attachments/<key>. Der Bot delegiert
    jeden User-Turn an den zentralen Orchestrator; Adaptive-Card-Rendering +
    Roster-Resolution bleiben Channel-intern.

permissions:
  # US4 (Conductor Surface) — provisions `ctx.events`; a plugin may only emit an
  # event id it declared via an `event_emit` capability (see `capabilities` above).
  events:
    emit: true
  memory:
    reads: []
    writes: []
  graph:
    reads: []
    writes: []
  network:
    # Teams-specific outbound; MS-Graph is covered by the
    # microsoft365 integration's own permissions.
    outbound:
      - "smba.trafficmanager.net"
      - "*.botframework.com"
  filesystem:
    scratch: false

integrations:
  - id: "bot_framework"
    kind: "http"
    target: "Microsoft Bot Framework (CloudAdapter inbound + reply)"
    auth_from: "microsoft_app_password"
    docs: "https://learn.microsoft.com/azure/bot-service/"

# Capabilities this plugin contributes to the kernel.
#
# Naming follows `docs/harness-platform/conventions/service-capabilities.md`.
# The Teams channel is today a pure CONSUMER (it doesn't publish services
# into the ServiceRegistry — the channel framework owns channel-handle
# registration separately via `DefaultChannelRegistry`).
#
# Hard-required (capability-resolver enforces these before activate()):
#   - `chatAgent@^1` — the orchestrator-published ChatAgentBundle. Channel
#     late-resolves it via `ctx.services.get<ChatAgentBundle>('chatAgent')`
#     and feeds `bundle.agent` into the TeamsBot. Without it the channel
#     has nothing to delegate user turns to, so we hard-block (S+10-4b).
#
requires:
  - "chatAgent@^1"

# omadia#838 — the thirteen further names this channel resolves through
# `ctx.services.get`, declared so the `@omadia/channel-teams` row in
# `STANDALONE_LEGACY_SERVICE_GRANTS_2026_08_20` can retire. The service gate
# (#795) accepts an `optional_requires:` entry as a full declaration, and the
# capability resolver deliberately never reads this list, so nothing here can
# hold activation back or add an ordering edge.
#
# Every name below is under `optional_requires:` rather than `requires:`, for
# one of two reasons.
#
# DEGRADABLE — resolved, found `undefined`, and activate() carries on with a
# narrower feature set:
#   - `channelDirectoryRegistry@1` — logs "not published" and skips the
#     /operator/channels contribution.
#   - `channelResolver@1`          — per-turn Agent routing; absent means every
#                                    turn goes to the default `chatAgent`.
#   - `conductorAwaitResolver@1`   — in-process approve/reject of a Conductor
#                                    await; absent means card clicks fall back
#                                    to the HTTP path.
#   - `embeddingClient@1`          — passed through, currently unused.
#   - `graphPool@1` + `tigrisStore@1` — both guarded by the same `if`; without
#                                    either, attachment persistence is off.
#   - `graphTenantId@1`            — defaults to 'default'.
#   - `microsoft365.graph@1`       — the integration publishes it only when app
#                                    credentials are configured, so `requires:`
#                                    would block activation in dev environments
#                                    without MS365 setup (the long-standing
#                                    S+11 note this block replaces).
#   - `routinesIntegration@1`      — routine cards are simply not rendered.
#   - `teamsProvisioner@1`         — #860 W2 auto-invite: published by the M365
#                                    connector's Teams provisioner. Resolved
#                                    with the BARE key 'teamsProvisioner'
#                                    (declaredServiceNames() strips the
#                                    version); absent → auto-invite disabled
#                                    with a log line, activation unaffected.
#   - `topicDetector@1`            — history passes through undetected.
#
# NOT DEGRADABLE, BUT KERNEL-PUBLISHED — `anthropicClient@1`, `turnContext@1`
# and `uiRouteCatalog@1` each make activate() throw when missing, so on the
# face of it they belong under `requires:`. They must not go there.
# `resolveCapabilities` builds its provider index exclusively from other
# plugins' `provides:` lists, and these three are published by the middleware
# kernel itself (`middleware/src/index.ts`), not by any plugin manifest. A
# `requires:` entry naming one of them is therefore permanently unresolved,
# and an unresolved `requires:` DROPS the consumer from the eligible set — the
# channel would silently never activate at all. `optional_requires:` grants the
# exact declaration the service gate asks for and leaves activate()'s own
# explicit throw as the honest failure mode.
optional_requires:
  - "anthropicClient@1"
  - "channelDirectoryRegistry@1"
  - "channelResolver@1"
  - "conductorAwaitResolver@1"
  - "embeddingClient@1"
  - "graphPool@1"
  - "graphTenantId@1"
  - "microsoft365.graph@1"
  - "routinesIntegration@1"
  - "teamsProvisioner@1"
  - "tigrisStore@1"
  - "topicDetector@1"
  - "turnContext@1"
  - "uiRouteCatalog@1"
provides: []
